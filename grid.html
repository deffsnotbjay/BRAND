<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRAND — Featured Grid</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --text-main: #ffffff;
            --text-dim: #666666;
            --grid-gap: 30px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 80px 40px;
            overflow-x: hidden;
        }

        /* 12-Column Grid for Precision Alignment */
        .editorial-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: var(--grid-gap);
            max-width: 1400px;
            margin: 0 auto;
        }

        .card {
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: inherit;
        }

        .img-container {
            width: 100%;
            overflow: hidden;
            background-color: #1a1a1a;
        }

        /* --- THE HOVER EFFECT --- */
        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            filter: grayscale(100%);
            transition: filter 0.7s cubic-bezier(0.22, 1, 0.36, 1),
                transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .card:hover img {
            filter: grayscale(0%);
            transform: scale(1.06);
        }

        /* --- CARD STYLING & GRID PLACEMENT --- */

        /* 01. JOY (The Master Size) */
        .card-1-style {
            grid-column: 1 / span 5;
            /* 5 Columns wide */
            aspect-ratio: 1.1 / 1;
        }

        /* 02. JESSE PARTY (Taller than before, spaced from Card 1) */
        .card-2 {
            grid-column: 8 / span 5;
            /* Starts at col 8 to create middle gap */
            aspect-ratio: 1.3 / 1;
            /* Increased height */
            margin-top: 80px;
            /* Vertical stagger */
        }

        /* 03. MOTHER PRAYER (Wider/Fuller Bridge) */
        .card-3 {
            grid-column: 1 / span 12;
            /* Spans full width */
            aspect-ratio: 24 / 8;
            /* Ultra-wide cinematic ratio */
            margin: 120px 0;
            /* Clear vertical space for captions */
        }

        /* 04. ANGEL (Exact size/span of Card 1) */
        .card-4-style {
            grid-column: 1 / span 5;
            aspect-ratio: 1.1 / 1;
            margin-top: 0;
        }

        /* 05. REDEMPTION (Exact size/span of Card 1 + Stagger) */
        .card-5-style {
            grid-column: 8 / span 5;
            aspect-ratio: 1.1 / 1;
            margin-top: 150px;
            /* Much lower to break alignment with Card 4 */
        }

        /* CAPTIONS */
        .caption {
            display: flex;
            justify-content: space-between;
            font-family: ui-monospace, monospace;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #333;
            transition: border-color 0.4s ease;
        }

        .card:hover .caption {
            border-color: #ffffff;
        }

        .caption .year {
            color: var(--text-dim);
        }

        /* Mobile Fix */
        @media (max-width: 900px) {
            .editorial-grid {
                display: flex;
                flex-direction: column;
            }

            .card {
                margin: 0 0 60px 0 !important;
                aspect-ratio: 1.1 / 1 !important;
            }
        }
    </style>
</head>
